# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",     # type annotations not required in tests
    "D",       # docstrings not required in tests
    "S101",    # assert is expected in tests
    "PLR2004", # magic values common in test assertions
    "N806",    # MockClient and similar uppercase vars are conventional
    "PLC0415", # imports inside test helpers are fine
    "FBT",     # boolean positional args common in test helpers
    "PT011",   # broad pytest.raises is sometimes intentional
    "ARG",     # unused args common in fixtures/callbacks
    "PERF402", # manual list copy fine in tests
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
