rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow:
    status: todo
    comment: Config flow fields have no data_description yet.
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; the API client ships with the integration.
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: todo
    comment: The README does not explain how to remove the integration.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to no events; all data comes from the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: todo
    comment: The coordinator is still stored in hass.data instead of entry.runtime_data.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters:
    status: todo
    comment: The README omits verify_ssl, polling interval and stats period from the setup step.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: todo
    comment: No platform sets PARALLEL_UPDATES.
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Kuvasz instances do not announce themselves via zeroconf, SSDP or DHCP.
  discovery-update-info:
    status: exempt
    comment: Kuvasz instances do not announce themselves via zeroconf, SSDP or DHCP.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: Monitors added in Kuvasz only appear after editing the monitor selection.
  entity-category: todo
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations:
    status: todo
    comment: Switch errors are translated; coordinator update and auth errors are not.
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: There are no user-fixable problems beyond reauthentication.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: The integration is not type-checked with mypy.
